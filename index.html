                  duration: 400,
                  ease: 'Back.easeOut'
              });

              // 3秒待ってから下にフェードアウト
              this.time.delayedCall(3000, () => {
                  this.tweens.add({
                      targets: logItem,
                      y: '+=50',
                      alpha: 0,
                      duration: 500,
                      onComplete: () => logItem.destroy()
                  });
              });
          }

          showMyAttack(targetId, amount, sourcePositions) {
              // ターゲットを記録（ロック用）
              this.currentTarget = targetId;
              
              const targetField = this.opponentFields.get(targetId);
              if (!targetField) return;

              // 自分の攻撃が特定の相手に飛んでいくアニメーション
              sourcePositions.slice(0, amount).forEach((pos, i) => {
                  const startX = pos.x;
                  const startY = pos.y;
                  
                  const particle = this.add.circle(startX, startY, CELL_SIZE * 0.25, 0x888888, 0.9);
                  particle.setDepth(200);

                  // 相手フィールドの中心へ
                  let targetX = targetField.x; 
                  let targetY = targetField.y;
                  
                  // フィールドの中央座標を計算 (scale考慮)
                  if (!this.is1v1Mode) {
                      // BRモードなどは中央基準で配置されている(createOpponentFields参照)
                      targetX = targetField.x + (targetField.width || (COLS * CELL_SIZE * targetField.scale)) / 2;
                      targetY = targetField.y + (targetField.height || (ROWS * CELL_SIZE * targetField.scale)) / 2;
                  } else {
                      // 1v1モード
                      targetX = targetField.x + (COLS * CELL_SIZE * targetField.scale) / 2;
                      targetY = targetField.y + (ROWS * CELL_SIZE * targetField.scale) / 2;
                  }
                  
                  // ユーザー要望「送り先に飛ぶ」 -> 中心
                  this.tweens.add({
                      targets: particle,
                      x: targetX,
                      y: targetY,
                      scale: 0.5,
                      alpha: 0,
                      duration: 800,
                      delay: i * 30,
                      ease: 'Power2',
                      onComplete: () => particle.destroy()
                  });
              });
          }

          receiveGarbage(fromPlayerId, amount, colors, sourcePositions) {
              // 攻撃元のフィールドを取得
              const sourceField = this.opponentFields.get(fromPlayerId);
              if (!sourceField) return;

              // おじゃまぷよをキューに追加 (設定されたラグ秒後に有効化)
              const delaySeconds = (this.gameSettings && this.gameSettings.garbageDelay !== undefined) ? this.gameSettings.garbageDelay : 3;
              this.garbageQueue.push({
                  amount: amount,
                  time: this.time.now + (delaySeconds * 1000)
              });
              this.updateGarbageGauge();

              // UIログ追加 (Received)
              this.addGarbageLog(`Received ${amount}`, 'red');

              // 攻撃元から自分のフィールドへ飛んでくるアニメーション
              sourcePositions.slice(0, amount).forEach((pos, i) => {
                  // 相手フィールドのスケール調整された位置から飛ばす
                  const sourceX = sourceField.x + sourceField.width / 2;
                  const sourceY = sourceField.y + sourceField.height / 2;

                  const particle = this.add.circle(sourceX, sourceY, CELL_SIZE * 0.25, 0x888888, 0.9);
                  particle.setDepth(200);

                  // 自分のフィールドの上部へ
                  const targetX = this.fieldOffsetX + COLS * CELL_SIZE / 2;
                  const targetY = -50;

                  this.tweens.add({
                      targets: particle,
                      x: targetX,
                      y: targetY,
                      scale: 0.8,
                      alpha: 0.6,
                      duration: 600,
                      delay: i * 50,
                      ease: 'Power2',
                      onComplete: () => {
                          particle.destroy();
                      }
                  });
              });
          }

          showThirdPartyAttack(fromPlayerId, toPlayerId, amount, sourcePositions) {
              const fromField = this.opponentFields.get(fromPlayerId);
              const toField = this.opponentFields.get(toPlayerId);
              
              if (!fromField || !toField) return;
              
              sourcePositions.slice(0, Math.min(amount, 10)).forEach((pos, i) => {
                  const sourceX = fromField.x + fromField.width / 2;
                  const sourceY = fromField.y + fromField.height / 2;
                  
                  const targetX = toField.x + toField.width / 2;
                  const targetY = toField.y + toField.height / 2;
                  
                  const particle = this.add.circle(sourceX, sourceY, CELL_SIZE * 0.2, 0x888888, 0.7);
                  particle.setDepth(200);
                  
                  this.tweens.add({
                      targets: particle,
                      x: targetX,
                      y: targetY,
                      scale: 0.5,
                      alpha: 0,
                      duration: 500,
                      delay: i * 30,
                      ease: 'Power2',
                      onComplete: () => particle.destroy()
                  });
              });
          }
          
          showOpponentHardDrop(playerId, data) {
              const field = this.opponentFields.get(playerId);
              if (!field) return;
              
              const startY = field.y + data.startRow * CELL_SIZE * field.scale + (CELL_SIZE * field.scale) / 2;
              const endY = field.y + data.endRow * CELL_SIZE * field.scale + (CELL_SIZE * field.scale) / 2;
              const x = field.x + data.col * CELL_SIZE * field.scale + (CELL_SIZE * field.scale) / 2;
              
              for (let i = 0; i < 5; i++) {
                  const trail = this.add.circle(
                      x,
                      startY + (endY - startY) * (i / 5),
                      CELL_SIZE * 0.3 * field.scale,
                      COLOR_VALUES[data.color],
                      0.3 - i * 0.05
                  );
                  trail.setDepth(field.bg.depth + 50);
                  this.tweens.add({
                      targets: trail,
                      alpha: 0,
                      duration: 200,
                      delay: i * 20,
                      onComplete: () => trail.destroy()
                  });
              }
          }
          
          showOpponentClear(playerId, data) {
              const field = this.opponentFields.get(playerId);
              if (!field) return;
              
              // アニメーション用のスプライトを保存
              const spritesToAnimate = [];
              
              data.positions.forEach((pos) => {
                  const puyo = field.grid[pos.row] && field.grid[pos.row][pos.col];
                  if (!puyo) return;
                  
                  const color = puyo.getData('color');
                  const x = puyo.x;
                  const y = puyo.y;
                  
                  // グリッドから即座に削除（遅延を減らす）
                  field.grid[pos.row][pos.col] = null;
                  
                  // アニメーション用に保存
                  spritesToAnimate.push({ puyo, color, x, y });
              });
              
              // アニメーション実行
              spritesToAnimate.forEach(({ puyo, color, x, y }) => {
                  for (let i = 0; i < 8; i++) {
                      const angle = (i / 8) * Math.PI * 2;
                      const distance = (40 + Math.random() * 20) * field.scale;
                      
                      const particle = this.add.circle(x, y, 6 * field.scale, COLOR_VALUES[color]);
                      if (field.bg) {
                          particle.setDepth(field.bg.depth + 100);
                      }
                      this.tweens.add({
                          targets: particle,
                          x: x + Math.cos(angle) * distance,
                          y: y + Math.sin(angle) * distance,
                          alpha: 0,
                          scale: 0.2,
                          duration: 500 + Math.random() * 200,
                          ease: 'Power2',
                          onComplete: () => particle.destroy()
                      });
                  }
                  
                  const ring = this.add.circle(x, y, 10 * field.scale, 0xffffff, 0.8);
                  if (field.bg) {
                      ring.setDepth(field.bg.depth + 100);
                  }
                  this.tweens.add({
                      targets: ring,
                      radius: 40 * field.scale,
                      alpha: 0,
                      duration: 400,
                      onComplete: () => ring.destroy()
                  });
                  
                  // ぷよ本体をアニメーションで消す
                  this.tweens.add({
                      targets: puyo,
                      scale: 0,
                      alpha: 0,
                      duration: 400,
                      ease: 'Back.easeIn',
                      onComplete: () => {
                          if (puyo && puyo.scene) puyo.destroy();
                      }
                  });
              });
          }

          async dropGarbagePuyos() {
              if (this.pendingGarbageCount <= 0) return;

              const dropAmount = Math.min(this.pendingGarbageCount, 30); // 一度に降る最大数
              this.pendingGarbageCount -= dropAmount;
              this.updateGarbageGauge();
              this.sendFieldUpdate(); // 即座に反映

              // このバッチ内で列ごとに何個落とすか追跡
              const dropsPerCol = new Array(COLS).fill(0);
              const promises = [];

              for (let i = 0; i < dropAmount; i++) {
                  const col = Phaser.Math.Between(0, COLS - 1);
                  const startY = -CELL_SIZE - (dropsPerCol[col] * CELL_SIZE); // 既にこのバッチで落としている分だけ上から
                  dropsPerCol[col]++;
                  
                  const x = this.fieldOffsetX + col * CELL_SIZE + CELL_SIZE / 2;

                  // 暫定的なターゲット（アニメーション用）- 実際には着地時に再計算
                  let targetRowEstimate = 0;
                  // 一番下の空きを探す
                  for (let row = ROWS - 1; row >= 0; row--) {
                      if (!this.grid[row][col]) {
                          targetRowEstimate = row;
                          break;
                      }
                  }
                  // バッチ内の積み上がり分を考慮（上に積む＝行番号を減らす）
                  targetRowEstimate -= (dropsPerCol[col] - 1);
                  if (targetRowEstimate < 0) targetRowEstimate = 0; 

                  // Gridにはまだ入れない！（Late-Binding）
                  const puyo = this.createPuyo(x, startY, 'gray');
                  puyo.setDepth(15); // プレイヤーの現在操作中のぷよより奥にする

                  const p = new Promise(resolve => {
                      this.tweens.add({
                          targets: puyo,
                          y: targetRowEstimate * CELL_SIZE + CELL_SIZE / 2,
                          duration: 400 + targetRowEstimate * 20,
                          ease: 'Bounce.easeOut',
                          onComplete: () => {
                              // アニメーション完了時に改めて着地判定
                              this.finalizeGarbageDrop(puyo, col);
                              resolve();
                          }
                      });
                  });
                  promises.push(p);

                  // 少しずらす（視覚的効果）
                  await this.delay(50);
              }

              // 全てのアニメーション完了を待つ
              await Promise.all(promises);

              // 最後に境界チェック
              this.checkBorderLine();
          }

          finalizeGarbageDrop(puyo, col) {
               // 最新のグリッド状況で空き場所を探す
               let targetRow = -1;
               for (let row = ROWS - 1; row >= 0; row--) {
                   if (!this.grid[row][col]) {
                       targetRow = row;
                       break;
                   }
               }
               
               if (targetRow >= 0) {
                   // 着地成功：グリッドに登録
                   this.grid[targetRow][col] = puyo;
                   // 位置補正（プレイヤーが下に置いていた場合など、ターゲットが変わるため）
                   puyo.y = targetRow * CELL_SIZE + CELL_SIZE / 2;
                   puyo.setDepth(20); // 通常のぷよと同じ深度に戻す
                   
                   // 着地エフェクトなどを入れるならここ
               } else {
                   // 溢れた場合
                   puyo.destroy();
               }
          }

          checkBorderLine() {
              let isDanger = false;
              // BORDER_LINEを超えているかチェック (index < BORDER_LINE)
              // BORDER_LINE (index 4) にぷよがあるのはセーフ
              // grid[3]以下にぷよがあるとアウト
              for (let col = 0; col < COLS; col++) {
                   if (this.grid[BORDER_LINE - 1][col] !== null) {
                       isDanger = true;
                       break;
                   }
              }

              if (isDanger) {
                  if (!this.defeatTimer && !this.gameOver) {
                      const defeatTime = (this.gameSettings && this.gameSettings.defeatTime) !== undefined ? this.gameSettings.defeatTime : 10;
                      
                      // 敗北猶予が0秒の場合は即座にゲームオーバー
                      if (defeatTime === 0) {
                          this.endGame();
                      } else {
                          // タイマー開始
                          this.defeatTimer = this.time.delayedCall(defeatTime * 1000, () => {
                              this.endGame();
                          });
                          this.defeatCountdownText.setVisible(true);
                      }
                      
                      // 枠を赤くする
                      if (this.myFieldBorder) {
                          this.myFieldBorder.setStrokeStyle(4, 0xff0000);
                      }
                  }
              } else {
                  // 解除
                  if (this.defeatTimer) {
                      this.defeatTimer.remove();
                      this.defeatTimer = null;
                      this.defeatCountdownText.setVisible(false);
                      
                      // 枠を元に戻す
                      if (this.myFieldBorder) {
                          this.myFieldBorder.setStrokeStyle(4, 0x2c3e50);
                      }
                  }
              }
          }

          handlePlayerDefeated(playerId) {
              // 敗北したプレイヤーのフィールドを崩壊させる
              const field = this.opponentFields.get(playerId);
              if (!field) return;

              // 常に落下アニメーションを実行（3人以上でも）
              this.collapseField(field, false);

              // 生存プレイヤーリストから削除
              const prevCount = this.alivePlayers.length;
              this.alivePlayers = this.alivePlayers.filter(id => id !== playerId);
              console.log(`PlayerDefeated: ${playerId}. Alive: ${prevCount} -> ${this.alivePlayers.length}`);

              // 1v1になったか確認（観戦者も含む）
              if (this.alivePlayers.length === 2) {
                  console.log('Switching to 1v1 Mode! (Delayed)');
                  this.time.delayedCall(3000, () => {
                       this.switchTo1v1();
                  });
              }
          }

          collapseMyField() {
              console.log('=== collapseMyField CALLED ===');
              console.log('collapseMyField executing');
              
              const shakeTargets = [];
              if (this.myFieldBorder) shakeTargets.push(this.myFieldBorder);
              this.children.list.forEach(child => {
                  if (child.active && child.getData && (child.getData('myField') || child.getData('myFieldBorder'))) {
                      shakeTargets.push(child);
                  }
              });

              // Manual Tween Chain for 0.2s Decay Shake
              // [15, -30, 25, -15, 5]
              const baseDuration = 40; 
              
              const doShake1 = () => {
                  if (shakeTargets.length === 0) return onShakeComplete();
                  this.tweens.add({ targets: shakeTargets, x: '+=15', duration: baseDuration, ease: 'Quad.easeOut', onComplete: doShake2 });
              };
              const doShake2 = () => {
                  this.tweens.add({ targets: shakeTargets, x: '-=30', duration: baseDuration, ease: 'Quad.easeOut', onComplete: doShake3 });
              };
              const doShake3 = () => {
                  this.tweens.add({ targets: shakeTargets, x: '+=25', duration: baseDuration, ease: 'Quad.easeOut', onComplete: doShake4 });
              };
              const doShake4 = () => {
                  this.tweens.add({ targets: shakeTargets, x: '-=15', duration: baseDuration, ease: 'Quad.easeOut', onComplete: doShake5 });
              };
              const doShake5 = () => {
                  this.tweens.add({ targets: shakeTargets, x: '+=5', duration: baseDuration, ease: 'Quad.easeOut', onComplete: onShakeComplete });
              };

              const onShakeComplete = () => {
                      const duration = 2000;
                      const fallDist = 1500;   

                      const frameElements = [];
                      const puyoElements = [];

                      const allChildren = this.children.list.slice();
                      allChildren.forEach(child => {
                          if (!child.active) return;
                          if (child.getData && (child.getData('myField') || child.getData('myFieldBorder'))) {
                              frameElements.push(child);
                          } else if (child.getData && child.getData('color') && !child.getData('myFieldBorder')) { 
                              puyoElements.push(child);
                          }
                      });

                      // Explicitly add all grid puyos to ensure they scatter
                      for (let row = 0; row < ROWS; row++) {
                          for (let col = 0; col < COLS; col++) {
                              if (this.grid[row][col] && this.grid[row][col].active) {
                                  // Avoid duplicates
                                  if (!puyoElements.includes(this.grid[row][col])) {
                                      puyoElements.push(this.grid[row][col]);
                                  }
                              }
                          }
                      }


                      console.log('collapseMyField - Scattering puyos:', puyoElements.length, 'frame elements:', frameElements.length);
                      console.log('Sample puyo element:', puyoElements[0]);

                      const applyCollapseTween = (targets) => {
                          targets.forEach(el => {
                              const vx = (Math.random() - 0.5) * 1000; // Increased for more scatter
                              const rot = (Math.random() - 0.5) * 60; 
                              
                              this.tweens.add({
                                  targets: el,
                                  props: {
                                      x: { value: el.x + vx, duration: duration, ease: 'Linear' },
                                      y: { value: el.y + fallDist, duration: duration, ease: 'Cubic.easeIn' }, 
                                      angle: { value: (el.angle || 0) + rot, duration: duration, ease: 'Linear' }
                                  },
                                  onComplete: () => { if(el.active) el.destroy(); }
                              });
                          });
                      };

                      applyCollapseTween(frameElements);
                      applyCollapseTween(puyoElements);
              };

              // Start Shake
              doShake1();
          }

          collapseField(field, isLocalShake = false) {
              console.log('=== collapseField CALLED for player:', field.playerId, '===');
              field.isCollapsing = true; // Prevent redraw during collapse
              
              const baseDuration = 40;
              const shakeTargets = [];
              
              if (field.bg) shakeTargets.push(field.bg);
              if (field.border) shakeTargets.push(field.border);
              if (field.name) shakeTargets.push(field.name);
              if (field.garbageGaugeBg) shakeTargets.push(field.garbageGaugeBg);
              if (field.garbageGauge) shakeTargets.push(field.garbageGauge);
              if (field.garbageCountText) shakeTargets.push(field.garbageCountText);
              
              const puyoTargets = [];
              for (let r = 0; r < ROWS; r++) {
                  for (let c = 0; c < COLS; c++) {
                      if (field.grid[r][c] && field.grid[r][c].active) {
                          puyoTargets.push(field.grid[r][c]);
                      }
                  }
              }
              if (field.pieceContainer) {
                  field.pieceContainer.list.forEach(child => {
                      if (child.active) puyoTargets.push(child);
                  });
                  puyoTargets.push(field.pieceContainer); 
              }
              const allTargets = [...shakeTargets, ...puyoTargets];

              const doShake1 = () => {
                  if (allTargets.length === 0) return onShakeComplete();
                  this.tweens.add({ targets: allTargets, x: '+=15', duration: baseDuration, ease: 'Quad.easeOut', onComplete: doShake2 });
              };
              const doShake2 = () => {
                  this.tweens.add({ targets: allTargets, x: '-=30', duration: baseDuration, ease: 'Quad.easeOut', onComplete: doShake3 });
              };
              const doShake3 = () => {
                  this.tweens.add({ targets: allTargets, x: '+=25', duration: baseDuration, ease: 'Quad.easeOut', onComplete: doShake4 });
              };
              const doShake4 = () => {
                  this.tweens.add({ targets: allTargets, x: '-=15', duration: baseDuration, ease: 'Quad.easeOut', onComplete: doShake5 });
              };
              const doShake5 = () => {
                  this.tweens.add({ targets: allTargets, x: '+=5', duration: baseDuration, ease: 'Quad.easeOut', onComplete: onShakeComplete });
              };

              const onShakeComplete = () => {
                      const duration = 2000;
                      const fallDist = 1500;
                      
                      const applyCollapseTween = (targets) => {
                          targets.forEach(el => {
                              const vx = (Math.random() - 0.5) * 600; 
                              const rot = (Math.random() - 0.5) * 60; 
                              
                              this.tweens.add({
                                  targets: el,
                                  props: {
                                      x: { value: el.x + vx, duration: duration, ease: 'Linear' },
                                      y: { value: el.y + fallDist, duration: duration, ease: 'Cubic.easeIn' },
                                      angle: { value: (el.angle || 0) + rot, duration: duration, ease: 'Linear' }
                                  },
                                  onComplete: () => { if(el.active) el.destroy(); }
                              });
                          });
                      };
                      applyCollapseTween(shakeTargets); 
                      applyCollapseTween(puyoTargets);
               };

               // Start
               doShake1();
          }

          switchTo1v1Spectator() {
               console.log('Switching to 1v1 Spectator Mode');
               // 既存のフィールド全削除
               this.opponentFields.forEach((field) => {
                   if (field.bg) field.bg.destroy();
                   if (field.border) field.border.destroy();
                   if (field.name) field.name.destroy();
                   if (field.garbageGaugeBg) field.garbageGaugeBg.destroy();
                   if (field.garbageGauge) field.garbageGauge.destroy();
                   if (field.garbageCountText) field.garbageCountText.destroy();
                   for(let r=0; r<ROWS; r++){
                       for(let c=0; c<COLS; c++){
                           if(field.grid[r][c]) field.grid[r][c].destroy();
                       }
                   }
                   if (field.pieceContainer) field.pieceContainer.destroy();
               });
               this.opponentFields.clear();

               // 生存プレイヤーのみで再構築 (Scale 1.0 で並べる)
               const survivors = this.players.filter(p => this.alivePlayers.includes(p.id));
               
                 const fieldWidth = COLS * CELL_SIZE; // Scale 1.0
                 const gap = 50;
                 const totalWidth = fieldWidth * 2 + gap; 

                 const camCenterX = this.cameras.main.centerX;
                 const p1X = camCenterX - totalWidth / 2;
                 const p2X = p1X + fieldWidth + gap;
                 const baseY = 0; // createField matches this (Top=0)

                 // 観戦者用もGarbage Gauge等をScale 1.0で生成必須
                 survivors.forEach((player, index) => {
                   const x = index === 0 ? p1X : p2X;
                   const y = baseY;
                   
                   const field = {
                       x: x,
                       y: y,
                       width: fieldWidth,
                       height: ROWS * CELL_SIZE,
                       scale: 1.0, 
                       grid: [],
                       playerId: player.id,
                   };
                   
                   for(let r=0; r<ROWS; r++) { field.grid[r] = []; for(let c=0; c<COLS; c++) field.grid[r][c] = null; }

                   field.bg = this.add.rectangle(x + fieldWidth/2, y + field.height/2, fieldWidth, field.height, 0xffffff).setOrigin(0.5);
                   field.border = this.add.rectangle(x + fieldWidth/2, y + field.height/2, fieldWidth+4, field.height+4, 0x000000, 0).setOrigin(0.5).setStrokeStyle(4, 0x2c3e50);
                   field.name = this.add.text(x + fieldWidth/2, y - 20, player.name, { fontSize: '24px', fontFamily: '"JetBrains Mono"', fill: '#333', fontStyle: 'bold' }).setOrigin(0.5);
                   
                   // おじゃまぷよゲージ (Scale 1.0位置)
                   field.garbageGaugeBg = this.add.rectangle(x + fieldWidth + 20, y + 200, 20, 400, 0x000000, 0.3).setOrigin(0, 0);
                   field.garbageGauge = this.add.rectangle(x + fieldWidth + 20, y + 600, 20, 0, 0xff0000).setOrigin(0, 1);
                   field.garbageCountText = this.add.text(x + fieldWidth + 20, y + 610, '0', { fontSize: '16px', fill: '#fff' }).setOrigin(0, 0);

                   this.opponentFields.set(player.id, field);
                 });
                 
                 // カメラリセット
                 this.cameras.main.pan(camCenterX, baseY + (ROWS * CELL_SIZE) / 2, 0); 
                 this.cameras.main.setZoom(1.0); 
          }

          switchTo1v1() {
               if (this.is1v1Mode) return;

               // 観戦者の場合は観戦者用レイアウトへ
               if (this.isSpectator) {
                   this.switchTo1v1Spectator();
                   return;
               }

               this.is1v1Mode = true;
               console.log('Switching to 1v1 mode (Player View)');
               
               // 現在のフィールド位置（自分）
               const oldFieldX = this.fieldOffsetX;
               
               // 新しいオフセット計算
               const fieldWidth = COLS * CELL_SIZE;
               const totalWidth = fieldWidth * 2 + 100; // 100px gap
               const newFieldX = (this.cameras.main.width - totalWidth) / 2;
               const diffX = newFieldX - oldFieldX;
               
               this.fieldOffsetX = newFieldX;
               
               // 背景・枠の再生成のため、既存のmyFieldタグ付きオブジェクトを削除
               // (ただしグリッド内のぷよは残す)
               const children = this.children.list.slice(); // コピーを作成
               children.forEach(child => {
                   if (child.active && (child.getData('myField') || child.getData('myFieldBorder'))) {
                       child.destroy();
                   }
               });
               
               // 新しい位置で自分フィールド枠生成
               this.createField(newFieldX, 'YOU');
               
               // UI要素の移動
               if (this.scoreText) this.scoreText.setPosition(newFieldX, ROWS * CELL_SIZE + 20);
               if (this.chainText) this.chainText.setPosition(newFieldX + COLS * CELL_SIZE / 2, ROWS * CELL_SIZE / 2);
                if (this.nextContainer) this.nextContainer.setPosition(newFieldX - 70, 80);
     
               // 予告ゲージの位置更新
               if (this.garbageGaugeBg) {
                   this.garbageGaugeBg.setPosition(newFieldX + COLS * CELL_SIZE + 20, 200);
               }
               if (this.garbageGauge) {
                   this.garbageGauge.setPosition(newFieldX + COLS * CELL_SIZE + 20, 600);
               }
               if (this.garbageCountText) {
                   this.garbageCountText.setPosition(newFieldX + COLS * CELL_SIZE + 20, 610);
               }
               if (this.comboText) {
                   this.comboText.setPosition(newFieldX + COLS * CELL_SIZE / 2, ROWS * CELL_SIZE / 2 + 40);
               }
               if (this.defeatCountdownText) {
                    this.defeatCountdownText.setPosition(
                        newFieldX + COLS * CELL_SIZE / 2,
                        ROWS * CELL_SIZE + 60
                    );
               }

               // 自分のぷよスプライトを移動
               for (let row = 0; row < ROWS; row++) {
                   for (let col = 0; col < COLS; col++) {
                       if (this.grid[row][col]) {
                           this.grid[row][col].x += diffX;
                       }
                   }
               }
               // 操作中のペアも移動
               if (this.currentPair) {
                   if (this.currentPair.main.sprite) this.currentPair.main.sprite.x += diffX;
                   if (this.currentPair.sub.sprite) this.currentPair.sub.sprite.x += diffX;
                   this.updateGhostPieces(); // ゴースト再描画
               }
               
               // 相手フィールドの更新 (残り1人のはず)
               // 既存の相手フィールド情報を取得して削除
               this.opponentFields.forEach((field, pid) => {
                   if (field.bg) field.bg.destroy();
                   if (field.border) field.border.destroy();
                   if (field.name) field.name.destroy();
                   if (field.garbageGaugeBg) field.garbageGaugeBg.destroy();
                   if (field.garbageGauge) field.garbageGauge.destroy();
                   if (field.garbageCountText) field.garbageCountText.destroy();
                   
                   // グリッドのぷよも一旦削除
                   for(let r=0; r<ROWS; r++){
                       for(let c=0; c<COLS; c++){
                           if(field.grid[r][c]) field.grid[r][c].destroy();
                       }
                   }
                   if (field.pieceContainer) field.pieceContainer.destroy();
               });
               this.opponentFields.clear();
               
               // 残っているプレイヤーに対してcreateOpponentFieldsを呼ぶ
               const opponents = this.players.filter(p => this.alivePlayers.includes(p.id) && p.id !== myPlayerId);
               this.createOpponentFields(opponents); 
          }


          sendPieceUpdate() {
              // スロットリング: 100ms以内の連続呼び出しを防ぐ
              const now = Date.now();
              if (this.lastPieceUpdateTime && (now - this.lastPieceUpdateTime) < 100) {
                  return;
              }
              this.lastPieceUpdateTime = now;
              
              if (ws && ws.readyState === WebSocket.OPEN && this.currentPair) {
                  ws.send(JSON.stringify({
                      type: 'piece_update',
                      data: {
                          col: this.currentPair.col,
                          row: this.currentPair.row,
                          rotation: this.currentPair.rotation,
                          colors: {
                              main: this.currentPair.main.color,
                              sub: this.currentPair.sub.color
                          }
                      }
                  }));
              }
          }

          updateOpponentField(playerId, data, garbageCount) {
              const field = this.opponentFields.get(playerId);
              if (!field) return;
              
              // Don't update if field is collapsing
              if (field.isCollapsing) {
                  console.log('Skipping updateOpponentField - field is collapsing');
                  return;
              }

              // Grid update
              if (data && data.length === ROWS) {
                  // Clear existing grid visuals
                  for (let r = 0; r < ROWS; r++) {
                      for (let c = 0; c < COLS; c++) {
                         if (field.grid[r][c]) {
                             field.grid[r][c].destroy();
                             field.grid[r][c] = null;
                         }
                      }
                  }

                  // Rebuild grid
                  for (let r = 0; r < ROWS; r++) {
                      for (let c = 0; c < COLS; c++) {
                          const color = data[r][c];
                          if (color) {
                              const x = field.x + c * CELL_SIZE * field.scale + (CELL_SIZE * field.scale) / 2;
                              const y = field.y + r * CELL_SIZE * field.scale + (CELL_SIZE * field.scale) / 2;
                              
                              if (this.is1v1Mode) {
                                  // Use createPuyo for full texture in 1v1
                                  // x, y, color, isGhost, customAlpha, animate
                                  const puyoContainer = this.createPuyo(x, y, color, false, 1, false); // Animate=false to prevent flicker
                                  puyoContainer.setScale(field.scale);
                                  // createPuyo adds puyo to 'this', but we want it tracked in grid
                                  // We should set depth
                                  puyoContainer.setDepth(field.bg.depth + 5);
                                  // createPuyo sets 'color' data
                                  
                                  field.grid[r][c] = puyoContainer;
                              } else {
                                  // Simple circle for Battle Royale (performance)
                                  const puyo = this.add.circle(x, y, CELL_SIZE * 0.38 * field.scale, COLOR_VALUES[color]);
                                  puyo.setStrokeStyle(2 * field.scale, 0xffffff, 0.5);
                                  puyo.setDepth(field.bg.depth + 5);
                                  puyo.setData('color', color); 
                                  field.grid[r][c] = puyo;
                              }
                          }
                      }
                  }
              }

              // Update Garbage Gauge
              if (garbageCount !== undefined) {
                   const maxGarbage = 30; // 5 lines * 6 = 30
                   const ratio = Math.min(garbageCount / maxGarbage, 1);
                   const gaugeHeight = (ROWS * CELL_SIZE) * ratio;
                   if (field.garbageGauge) {
                       field.garbageGauge.height = gaugeHeight;
                   }
                   if (field.garbageCountText) {
                       field.garbageCountText.setText(garbageCount > 0 ? garbageCount.toString() : '');
                   }
              }
          }

          updateOpponentPiece(playerId, data) {
              const field = this.opponentFields.get(playerId);
              if (!field) return;
              
              // 前回のピース表示を削除
              if (!field.pieceContainer) {
                  field.pieceContainer = this.add.container(0, 0);
              }
              if (field.bg) {
                  field.pieceContainer.setDepth(field.bg.depth + 10);
              }
              field.pieceContainer.removeAll(true);
              
              // 相手フィールド上の座標計算
              const positions = this.getPairPositions(data.col, data.row, data.rotation);
              
              // 描画 (半透明で表示、スケール対応)
              const drawPiece = (pos, color) => {
                  if (pos.row < 0) return; // 画面外
                  const x = field.x + pos.col * CELL_SIZE * field.scale + (CELL_SIZE * field.scale) / 2;
                  const y = field.y + pos.row * CELL_SIZE * field.scale + (CELL_SIZE * field.scale) / 2;
                  
                  if (this.is1v1Mode) {
                      // Use createPuyo for full texture in 1v1
                      const puyoContainer = this.createPuyo(x, y, color, false, 0.6, false);
                      puyoContainer.setScale(field.scale);
                      puyoContainer.setDepth(field.bg.depth + 10);
                      field.pieceContainer.add(puyoContainer);
                  } else {
                      // Simple circle for Battle Royale
                      const puyo = this.add.circle(x, y, CELL_SIZE * 0.38 * field.scale, COLOR_VALUES[color], 0.6);
                      puyo.setData('color', color);
                      puyo.setStrokeStyle(2 * field.scale, 0xffffff, 0.5);
                      puyo.setDepth(field.bg.depth + 10);
                      field.pieceContainer.add(puyo);
                  }
              };
              
              drawPiece(positions.main, data.colors.main);
              drawPiece(positions.sub, data.colors.sub);
          }

          handleGameEnd(winnerId, isWinner, scoreboard) {
              this.gameOver = true;
              if (this.dropTimer) this.dropTimer.remove();
              if (this.defeatTimer) this.defeatTimer.remove();
              this.defeatCountdownText.setVisible(false);

              if (isWinner) {
                  this.showMessage('YOU WIN!');
              } else if (!this.isSpectator) {
                  // 負けた場合は自分のフィールドを崩壊
                  this.collapseMyField();
                  this.showMessage('YOU LOSE...');
              }
              
              // スコアボードを表示（ホストのみNEXTボタン付き）
              if (scoreboard && scoreboard.length > 0) {
                  this.time.delayedCall(1500, () => {
                      this.showScoreboard(scoreboard, isHost);
                  });
              }
              
              // 自動的にロビーに戻らない（NEXTボタン待ち）
          }
          
          enterSpectatorMode(players) {
              this.isSpectator = true;
              this.gameStarted = true;
              this.players = players.filter(p => !p.isSpectator);
              this.alivePlayers = players.filter(p => p.alive).map(p => p.id);
              
              // 待機テキストを削除
              if (this.waitingText) {
                  this.waitingText.destroy();
                  this.waitingText = null;
              }
              
              // 既存の要素をクリア
              this.children.removeAll(true);
              
              // 観戦モード表示
              const spectatorText = this.add.text(
                  this.cameras.main.centerX,
                  50,
                  'SPECTATING',
                  {
                      fontSize: '32px',
                      fontFamily: '"JetBrains Mono"',
                      fill: '#ff6b6b',
                      fontStyle: 'bold',
                      stroke: '#ffffff',
                      strokeThickness: 4
                  }
              ).setOrigin(0.5).setDepth(1000);
              
              // 全プレイヤーのフィールドを表示
              this.createSpectatorView(this.players);
          }
          
          createSpectatorView(players) {
              // グリッドレイアウトで全プレイヤーを表示
              const fieldWidth = COLS * CELL_SIZE * 0.35;
              const fieldHeight = ROWS * CELL_SIZE * 0.35;
              const spacing = 20;
              const cols = 3;
              const startX = 50;
              const startY = 120;
              
              players.forEach((player, index) => {
                  const col = index % cols;
                  const row = Math.floor(index / cols);
                  
                  const x = startX + col * (fieldWidth + spacing);
                  const y = startY + row * (fieldHeight + spacing + 30);
                  
                  const field = {
                      x: x,
                      y: y,
                      width: fieldWidth,
                      height: fieldHeight,
                      scale: 0.35,
                      grid: [],
                      border: null,
                      bg: null,
                      name: null,
                      playerId: player.id
                  };
                  
                  // グリッド初期化
                  for (let row = 0; row < ROWS; row++) {
                      field.grid[row] = [];
                      for (let col = 0; col < COLS; col++) {
                          field.grid[row][col] = null;
                      }
                  }
                  
                  // 背景
                  field.bg = this.add.rectangle(
                      x + fieldWidth / 2,
                      y + fieldHeight / 2,
                      fieldWidth,
                      fieldHeight,
                      0xffffff
                  ).setOrigin(0.5);
                  
                  // 枠
                  field.border = this.add.rectangle(
                      x + fieldWidth / 2,
                      y + fieldHeight / 2,
                      fieldWidth + 2,
                      fieldHeight + 2,
                      0x000000,
                      0
                  ).setOrigin(0.5);
                  field.border.setStrokeStyle(2, 0x95a5a6);
                  
                  // プレイヤー名
                  field.name = this.add.text(x + fieldWidth / 2, y - 15, player.name, {
                      fontSize: '12px',
                      fontFamily: '"JetBrains Mono"',
                      fill: '#333',
                      fontStyle: 'bold'
                  }).setOrigin(0.5);
                  
                  this.opponentFields.set(player.id, field);
              });
          }
          
          showScoreboard(scoreboard, isHost = false) {
              // 半透明の背景
              const overlay = this.add.rectangle(
                  this.cameras.main.centerX,
                  this.cameras.main.centerY,
                  this.cameras.main.width,
                  this.cameras.main.height,
                  0x000000,
                  0.8
              ).setOrigin(0.5).setDepth(2000);
              
              // スコアボードタイトル
              const title = this.add.text(
                  this.cameras.main.centerX,
                  150,
                  'FINAL RESULTS',
                  {
                      fontSize: '48px',
                      fontFamily: '"JetBrains Mono"',
                      fill: '#ffffff',
                      fontStyle: 'bold'
                  }
              ).setOrigin(0.5).setDepth(2001).setAlpha(0);
              
              this.tweens.add({
                  targets: title,
                  alpha: 1,
                  scale: 1.2,
                  duration: 600,
                  ease: 'Back.easeOut'
              });
              
              // 各プレイヤーのスコアをアニメーション付きで表示
              scoreboard.forEach((player, index) => {
                  const y = 250 + index * 70;
                  const delay = 800 + index * 200;
                  
                  // 順位アイコン
                  const rankColor = index === 0 ? '#FFD700' : index === 1 ? '#C0C0C0' : index === 2 ? '#CD7F32' : '#888888';
                  const rankText = this.add.text(
                      this.cameras.main.centerX - 300,
                      y,
                      `#${player.rank}`,
                      {
                          fontSize: '32px',
                          fontFamily: '"JetBrains Mono"',
                          fill: rankColor,
                          fontStyle: 'bold'
                      }
                  ).setOrigin(0.5).setDepth(2001).setAlpha(0);
                  
                  // プレイヤー名
                  const nameText = this.add.text(
                      this.cameras.main.centerX - 150,
                      y,
                      player.name + (player.isWinner ? ' 👑' : ''),
                      {
                          fontSize: '24px',
                          fontFamily: '"JetBrains Mono"',
                          fill: '#ffffff',
                          fontStyle: 'bold'
                      }
                  ).setOrigin(0, 0.5).setDepth(2001).setAlpha(0);
                  
                  // スコア
                  const scoreText = this.add.text(
                      this.cameras.main.centerX + 200,
                      y,
                      `${player.score}`,
                      {
                          fontSize: '28px',
                          fontFamily: '"JetBrains Mono"',
                          fill: '#4a90e2',
                          fontStyle: 'bold'
                      }
                  ).setOrigin(1, 0.5).setDepth(2001).setAlpha(0);
                  
                  // アニメーション
                  this.tweens.add({
                      targets: [rankText, nameText, scoreText],
                      alpha: 1,
                      x: '+=20',
                      duration: 400,
                      delay: delay,
                      ease: 'Power2'
                  });
              });
              
              // ホスト制御に戻す (個別退出は不具合のため廃止、ホスト待ちステータスを表示)
              if (isHost) {
                  const nextButton = this.add.rectangle(
                      this.cameras.main.centerX,
                      this.cameras.main.height - 100,
                      200,
                      60,
                      0x4a90e2
                  ).setOrigin(0.5).setDepth(2001).setAlpha(0).setInteractive();
                  
                  const nextText = this.add.text(
                      this.cameras.main.centerX,
                      this.cameras.main.height - 100,
                      'LOBBY', 
                      {
                          fontSize: '28px',
                          fontFamily: '"JetBrains Mono"',
                          fill: '#ffffff',
                          fontStyle: 'bold'
                      }
                  ).setOrigin(0.5).setDepth(2002).setAlpha(0);
                  
                  this.tweens.add({ targets: [nextButton, nextText], alpha: 1, duration: 400, delay: 800 + scoreboard.length * 200 + 500 });
                  
                  nextButton.on('pointerover', () => nextButton.setFillStyle(0x357abd));
                  nextButton.on('pointerout', () => nextButton.setFillStyle(0x4a90e2));
                  
                  nextButton.on('pointerdown', () => {
                      if (ws && ws.readyState === WebSocket.OPEN) {
                          ws.send(JSON.stringify({ type: 'return_to_lobby' }));
                      }
                      this.resetGame();
                      returnToLobby();
                  });
              } else {
                  // ゲストはホスト待ち
                  const waitingText = this.add.text(
                      this.cameras.main.centerX,
                      this.cameras.main.height - 100,
                      'WAITING FOR HOST...',
                      {
                          fontSize: '24px',
                          fontFamily: '"JetBrains Mono"',
                          fill: '#aaaaaa',
                          fontStyle: 'bold'
                      }
                  ).setOrigin(0.5).setDepth(2002).setAlpha(0);
                  
                  this.tweens.add({ targets: waitingText, alpha: 1, duration: 400, delay: 800 + scoreboard.length * 200 + 500 });
              }
          }

          collapseMyField() {
              console.log('=== collapseMyField (second definition) CALLED ===');
              const duration = 2000;
              const fallDistance = 1500;
              
              const frameElements = [];
              const puyoElements = [];
              
              // 枠と背景
              if (this.myFieldBorder) frameElements.push(this.myFieldBorder);
              this.children.list.forEach(child => {
                  if (child.getData && (child.getData('myField') || child.getData('myFieldBorder'))) {
                      frameElements.push(child);
                  }
              });
              
              // グリッド内のぷよを明示的に収集
              for (let row = 0; row < ROWS; row++) {
                  for (let col = 0; col < COLS; col++) {
                      if (this.grid[row][col] && this.grid[row][col].active) {
                          puyoElements.push(this.grid[row][col]);
                      }
                  }
              }
              
              // UI要素
              const uiElements = [this.scoreText, this.chainText, this.nextContainer, this.garbageGaugeBg, this.garbageGauge, this.garbageCountText, this.comboText];
              uiElements.forEach(el => {
                 if(el) frameElements.push(el);
              });
              
              console.log('Scattering - Frame elements:', frameElements.length, 'Puyos:', puyoElements.length);
              
              // 個別にランダムな横移動と回転を適用
              const applyScatter = (targets) => {
                  targets.forEach(element => {
                      if (!element || !element.active) return;
                      
                      const vx = (Math.random() - 0.5) * 1000; // Random horizontal velocity
                      const rot = (Math.random() - 0.5) * 60;  // Random rotation
                      
                      this.tweens.add({
                          targets: element,
                          props: {
                              x: { value: element.x + vx, duration: duration, ease: 'Linear' },
                              y: { value: element.y + fallDistance, duration: duration, ease: 'Cubic.easeIn' },
                              angle: { value: (element.angle || 0) + rot, duration: duration, ease: 'Linear' }
                          },
                          onComplete: () => {
                              if (element && element.active) element.destroy();
                          }
                      });
                  });
              };
              
              applyScatter(frameElements);
              applyScatter(puyoElements);
          }

          showMessage(text) {
              const message = this.add.text(
                  this.cameras.main.centerX,
                  this.cameras.main.centerY,
                  text,
                  {
                      fontSize: '48px',
                      fontFamily: '"JetBrains Mono"',
                      fill: '#fff',
                      fontStyle: 'bold',
                      stroke: '#000',
                      strokeThickness: 6
                  }
              ).setOrigin(0.5).setDepth(1000);

              message.setAlpha(0);
              this.tweens.add({
                  targets: message,
                  alpha: 1,
                  scale: 1.3,
                  duration: 600,
                  ease: 'Elastic.easeOut'
              });
          }

          endGame() {
              this.gameOver = true;
              if (this.dropTimer) this.dropTimer.remove();
              if (this.defeatTimer) this.defeatTimer.remove();
              this.defeatCountdownText.setVisible(false);

              this.collapseMyField();

              if (ws && ws.readyState === WebSocket.OPEN) {
                  ws.send(JSON.stringify({
                      type: 'game_over'
                  }));
              }
          }

          resetGame() {
              this.gameStarted = false;
              this.score = 0;
              this.gameOver = false;
              this.isMoving = false;
              this.chainCount = 0;
              this.pendingGarbage = [];
              this.players = [];
              this.alivePlayers = [];

              this.children.removeAll(true);
              this.opponentFields.clear();

              for (let row = 0; row < ROWS; row++) {
                  this.grid[row] = [];
                  for (let col = 0; col < COLS; col++) {
                      this.grid[row][col] = null;
                  }
              }
          }
      }

      let game = null;

      function initGame() {
          if (game) return;

          const config = {
              type: Phaser.WEBGL,
              canvas: document.createElement('canvas'),
              width: 1000,
              height: 700,
              parent: 'game-container',
              backgroundColor: '#ffffff',
              scene: MultiplayerPuyoPuyo,
              render: {
                  antialias: true,
                  pixelArt: false,
                  roundPixels: false,
                  transparent: false,
                  clearBeforeRender: true,
                  preserveDrawingBuffer: false,
                  powerPreference: 'high-performance',
                  batchSize: 2048
              },
              scale: {
                  mode: Phaser.Scale.FIT,
                  autoCenter: Phaser.Scale.CENTER_BOTH,
                  width: 1000,
                  height: 700,
                  parent: 'game-container'
              },
              dom: {
                  createContainer: false
              },
              fps: {
                  target: 120,
                  forceSetTimeOut: false,
                  min: 30,
                  smoothStep: true
              }
          };

          game = new Phaser.Game(config);
      }

      window.addEventListener('load', () => {
          connectWebSocket();
          initGame();
      });
    </script>
  </body>
</html>
